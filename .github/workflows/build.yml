name: Build Turit (Windows)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        shell: pwsh
        run: Expand-Archive turit.zip -DestinationPath . -Force

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: turit

      - name: Engine tests
        working-directory: turit
        run: cargo test -p turit-engine

      - name: Fetch yt-dlp and ffmpeg
        shell: pwsh
        working-directory: turit
        run: |
          New-Item -ItemType Directory -Force src-tauri/bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile src-tauri/bin/yt-dlp.exe
          $rel = Invoke-RestMethod https://api.github.com/repos/GyanD/codexffmpeg/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -like "*essentials_build.zip" } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $exe = Get-ChildItem -Recurse ffmpeg-tmp -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName src-tauri/bin/ffmpeg.exe

      - name: Install Tauri CLI
        working-directory: turit
        run: npm install

      - name: Build app
        working-directory: turit
        run: npx tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Turit-installer
          path: turit/target/release/bundle/nsis/*.exe

      - name: Upload browser extension
        uses: actions/upload-artifact@v4
        with:
          name: Turit-browser-extension
          path: turit/extension/
